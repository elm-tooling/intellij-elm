# GitHub Actions Workflow created for testing and preparing the plugin release in following steps:
# - validate Gradle Wrapper,
# - run 'test' and 'verifyPlugin' tasks,
# - run Qodana inspections,
# - run 'buildPlugin' task and prepare artifact for the further tests,
# - run plugin verification tasks,
# - create a draft release.
#
# Workflow is triggered on push and pull_request events.
#
# GitHub Actions reference: https://help.github.com/en/actions
#
## JBIJPPTPL

name: Build
on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g. for dependabot pull requests)
  push:
    branches: [main, develop]
  # Trigger the workflow on any pull request
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # Run Gradle Wrapper Validation Action to verify the wrapper's checksum
  # Run verifyPlugin, IntelliJ Plugin Verifier, and test Gradle tasks
  # Build plugin and provide the artifact for the next workflow jobs
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}
      changelog: ${{ steps.properties.outputs.changelog }}
      pluginVerifierHomeDir: ${{ steps.properties.outputs.pluginVerifierHomeDir }}
      artifactName: ${{ steps.artifact.outputs.filename }}
    steps:

      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Setup Java 21 environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Set environment variables
      - name: Export Properties
        id: properties
        shell: bash
        run: |
          PROPERTIES="$(./gradlew properties --console=plain -q)"
          VERSION="$(echo "$PROPERTIES" | grep "^version:" | cut -f2- -d ' ')"
          CHANGELOG="$(./gradlew getChangelog --unreleased --no-header --console=plain -q)"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "pluginVerifierHomeDir=~/.pluginVerifier" >> $GITHUB_OUTPUT
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Commented out as this should work with intellij-platform-gradle-plugin v1.5+, see:
      # https://github.com/JetBrains/intellij-platform-gradle-plugin/issues/909
      #    ./gradlew listProductsReleases # prepare list of IDEs for Plugin Verifier

      # Build plugin
      - name: Build plugin
        run: ./gradlew buildPlugin

      # Resolve plugin ZIP filename for artifact naming and downstream jobs
      - name: Resolve plugin ZIP filename
        id: artifact
        shell: bash
        run: |
          ZIP_PATH="$(ls ./build/distributions/*.zip | head -n 1)"
          ZIP_FILENAME="$(basename "$ZIP_PATH")"
          ARTIFACT_NAME="${ZIP_FILENAME%.zip}"
          echo "path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "filename=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      # Store plugin ZIP for release draft asset upload
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          archive: false


  # Run tests and upload a code coverage report
  test:
    name: Test
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install elm tools
        run: npm install --global elm elm-test elm-format elm-review lamdera

      # Run tests
      - name: Run Tests
        run: ./gradlew check koverXmlReportJvm

      # Collect Tests Result of failed tests
      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests

      # Upload the Kover report to CodeCov
      - name: Check Coverage Report
        id: coverage
        shell: bash
        run: |
          REPORT_MAIN="${{ github.workspace }}/build/reports/kover/report.xml"
          REPORT_JVM="${{ github.workspace }}/build/reports/kover/reportJvm.xml"
          if [[ -f "$REPORT_MAIN" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "report=$REPORT_MAIN" >> "$GITHUB_OUTPUT"
          elif [[ -f "$REPORT_JVM" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "report=$REPORT_JVM" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Coverage report not found at $REPORT_MAIN or $REPORT_JVM"
          fi

      - name: Upload Code Coverage Report
        if: steps.coverage.outputs.exists == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: ${{ steps.coverage.outputs.report }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Skip Codecov Upload (No Coverage File)
        if: steps.coverage.outputs.exists != 'true'
        run: echo "Skipping Codecov upload because coverage XML was not generated."

  # Run Qodana inspections and provide report
  inspectCode:
    name: Inspect code
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false

      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v4

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21

      # Run Qodana inspections
      - name: Qodana - Code Inspection
        uses: JetBrains/qodana-action@v2023.3.1
        with:
          cache-default-branch-only: true

  # Run plugin structure verification along with IntelliJ Plugin Verifier
  verify:
#    if: false # Temporarily disable (re-enable also in `needs` of `releaseDraft`)
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false

      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Cache Plugin Verifier IDEs
      - name: Setup Plugin Verifier IDEs Cache
        uses: actions/cache@v4
        with:
          path: ${{ needs.build.outputs.pluginVerifierHomeDir }}/ides
          key: plugin-verifier-${{ hashFiles('build/listProductsReleases.txt') }}

      # Run plugin verification tasks (configuration, structure, and IntelliJ Plugin Verifier)
      - name: Run Plugin Verification tasks
        run: ./gradlew verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin -Dplugin.verifier.home.dir=${{ needs.build.outputs.pluginVerifierHomeDir }}

      # Collect Plugin Verifier Result
      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier

  # Prepare and/or publish GitHub releases based on version label:
  # - beta => draft only
  # - rc => prerelease (published)
  # - plain semver => full release (published)
  releaseDraft:
    name: Create/Publish Release
    if: github.event_name != 'pull_request'
    needs: [ build, test, inspectCode, verify ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Remove old release drafts by using the curl request for the available releases with a draft flag
      - name: Remove Old Release Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      # Download plugin ZIP artifact from the build job for release upload
      - name: Download Release Artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifactName }}
          path: ./build/distributions

      # Create GitHub release with mode inferred from plugin version
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ needs.build.outputs.changelog }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          TAG="v$VERSION"
          ZIP_PATH="$(find ./build/distributions -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [[ -z "$ZIP_PATH" ]]; then
            echo "No plugin ZIP found in ./build/distributions"
            exit 1
          fi

          if [[ "$VERSION" == *"-beta"* ]]; then
            RELEASE_FLAG="--draft"
            RELEASE_KIND="draft (beta)"
          elif [[ "$VERSION" == *"-rc"* ]]; then
            RELEASE_FLAG="--prerelease"
            RELEASE_KIND="pre-release (rc)"
          elif [[ "$VERSION" == *"-"* ]]; then
            echo "Unsupported prerelease label in version: $VERSION"
            echo "Only beta and rc labels are supported by this workflow."
            exit 1
          else
            RELEASE_FLAG=""
            RELEASE_KIND="full release"
          fi

          echo "Creating $RELEASE_KIND for $TAG"

          gh release create "$TAG" \
            $RELEASE_FLAG \
            --title "$TAG" \
            --notes "$RELEASE_NOTES" \
            "$ZIP_PATH"
